# Listino dell'app @@APP_NAME@@ — pricing-as-code (UC 0022). Chiave stabile: slug '@@APP_ID@@'.
#
# ⚠️ BOZZA GENERATA DALLO SCAFFOLDING (tools/new-application, UC 0046) — DA COMPLETARE.
# Lo scaffolding crea SOLO il livello gratuito, con un tetto prudente sulla metrica scelta: serve a
# far girare l'app end-to-end (gate 402 + gate 429) prima ancora che i prezzi siano decisi. I livelli
# a pagamento li scrive il co-pilota prezzi/quota della skill `new-application`, che guida su:
#   - prezzo mensile e annuale (sconto indicativo ~17%, cioè due mesi in omaggio);
#   - prova gratuita (default 14 giorni, disattivabile);
#   - commissione effettiva del fornitore di pagamento, con avviso non bloccante oltre il 10%.
#
# La natura è `stock` (a giacenza): il tetto vale su quanti @@METRIC@@ esistono ORA, non su quanti se
# ne creano nel periodo, e NON esiste una `window` — dichiararne una qui sarebbe una contraddizione,
# perché non c'è nessun azzeramento periodico da descrivere. Deve corrispondere a come
# @@APP_CLASS@@QuotaService conta l'uso: le due cose si cambiano insieme o non si cambiano.

slug: @@APP_ID@@
name: @@APP_NAME@@
userModel: @@USER_MODEL@@
# Parte descrittiva mostrata nella vetrina del catalogo (UC 0095): `category` è la tinta della card
# (green | amber | red | blue | violet | teal — senza, se ne deriva una stabile dallo slug) e
# `descriptions` la descrizione breve nelle 5 lingue del prodotto. Entrambe FACOLTATIVE, entrambe DA
# COMPLETARE come il resto della bozza: il generatore non può scrivere cinque traduzioni al posto tuo.
# Finché mancano, in vetrina la card mostra il solo nome — e comunque l'app non vi compare finché
# `status` resta `inactive`. Esempio da scommentare e tradurre:
#
# category: blue
# descriptions:
#   it: Che cosa fa @@APP_NAME@@, in una riga.
#   en: What @@APP_NAME@@ does, in one line.
#   fr: Ce que fait @@APP_NAME@@, en une ligne.
#   es: Qué hace @@APP_NAME@@, en una línea.
#   de: Was @@APP_NAME@@ macht, in einer Zeile.
# `inactive` finché il listino non è completo e rivisto: l'app esiste a catalogo ma non è vendibile.
# Passa ad `active` quando i livelli a pagamento sono decisi e la landing è pronta.
status: inactive
tiers:
  - key: free
    name: @@APP_NAME@@ Free
    trialDays: 0
    limits: { metric: @@METRIC@@, cap: @@FREE_CAP@@, type: stock }
    features: {}
    prices: []
