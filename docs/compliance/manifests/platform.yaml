# Manifesto dati — sezione PIATTAFORMA (UC 0030, #13 C14/C15/C18).
# Fonte unica: alimenta il RoPA interno (docs/compliance/ropa.<lang>.md, generato — NON editarlo a mano),
# lo snippet privacy pubblico (UC 0002) e l'export/erasure (UC 0032).
# Voci `entity`+`field` = entity-backed: il check JUnit (services/commons) le incrocia con @PersonalData.
# BOZZA SOTTO DISCLAIMER: validazione finale del legale (docs/_REVISIONE-LEGALE.md).

id: platform
name:
  it: Piattaforma appgrove (core)
  en: appgrove platform (core)
description:
  it: >-
    Trattamenti trasversali della piattaforma (account, identità delle persone, appartenenze,
    inviti, autenticazione, log). Dopo UC 0116 l'identità della persona è un dato di
    **piattaforma** (indirizzo, nome, lingua, identificativo di autenticazione) e l'appartenenza a
    un account è un dato **dell'account**: non cambia la finalità, cambia chi risponde per il dato.
    appgrove agisce come titolare per i consumatori B2C e come responsabile per i tenant B2B
    titolari (#13 C13). Paddle (Merchant of Record) è titolare autonomo per i dati di pagamento.
  en: >-
    Cross-cutting platform processing (accounts, person identities, memberships, invitations,
    authentication, logs). After UC 0116 the person's identity is **platform** data (email, name,
    language, authentication identifier) and account membership is **account** data: the purpose does
    not change, the party accountable for the data does.
    appgrove acts as controller towards B2C consumers and as processor for B2B tenant
    controllers (#13 C13). Paddle (Merchant of Record) is an independent controller for payment data.

entries:
  - key: identity.email
    entity: app.appgrove.core.platform.Identity
    field: email
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma (una identità, una o più appartenenze ad account)
      en: People registered on the platform (one identity, one or more account memberships)
    data_category:
      it: Contatto (indirizzo email)
      en: Contact data (email address)
    purpose:
      it: Erogazione e gestione dell'account (login, comunicazioni di servizio)
      en: Account provisioning and management (login, service communications)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Finché la persona ha almeno una appartenenza attiva + 14 giorni di grace dopo l'eliminazione
        dell'ultimo account (#13 E25); l'eliminazione di un account non cancella l'identità di chi
        appartiene anche ad altri account (UC 0116)
      en: >-
        While the person has at least one active membership + 14-day grace period after the last
        account is deleted (#13 E25); deleting one account does not erase the identity of someone who
        also belongs to other accounts (UC 0116)

  - key: identity.display_name
    entity: app.appgrove.core.platform.Identity
    field: displayName
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Identità (nome visualizzato)
      en: Identity (display name)
    purpose:
      it: Identificazione della persona nell'interfaccia e negli account a cui appartiene
      en: Identification of the person in the UI and across the accounts they belong to
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: identity.locale
    entity: app.appgrove.core.platform.Identity
    field: locale
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Preferenza dell'utente (lingua)
      en: User preference (language)
    purpose:
      it: >-
        Scelta della lingua (inglese/italiano) delle email transazionali di autenticazione
        (verifica indirizzo, reimpostazione password, invito) — UC 0018
      en: >-
        Language selection (English/Italian) for transactional authentication emails
        (address verification, password reset, invitation) — UC 0018
    legal_basis:
      it: Contratto (art. 6.1.b GDPR) — email transazionali, distinte dalla newsletter (consenso separato, #13 F29)
      en: Contract (art. 6(1)(b) GDPR) — transactional emails, distinct from the newsletter (separate consent, #13 F29)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: identity.cognito_sub
    entity: app.appgrove.core.platform.Identity
    field: cognitoSub
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Identificativo online (subject Cognito, pseudo-identificatore)
      en: Online identifier (Cognito subject, pseudo-identifier)
    purpose:
      it: Collegamento tra identità di autenticazione (Cognito) e profilo applicativo
      en: Link between the authentication identity (Cognito) and the application profile
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: membership.identity_id
    entity: app.appgrove.core.platform.Membership
    field: identityId
    location:
      it: Tabella `platform.membership` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.membership` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persone che appartengono a un account (membri, amministratori, titolari dell'account)
      en: People belonging to an account (members, administrators, account owners)
    data_category:
      it: >-
        Identificativo online (riferimento all'identità della persona): il legame fra una persona e
        un'azienda è a sua volta un dato personale, anche se non contiene nome né indirizzo
      en: >-
        Online identifier (reference to the person's identity): the link between a person and a
        company is itself personal data, even though it contains neither name nor email
    purpose:
      it: >-
        Stabilire chi può presentarsi come persona di quell'account e con quale ruolo (UC 0116);
        l'account resta il confine dei dati
      en: >-
        Establishing who may act as a person of that account and in which role (UC 0116); the account
        remains the data boundary
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Finché l'appartenenza è viva; eliminata con l'account (+ 14 giorni di grace, #13 E25).
        L'uscita da un account chiude l'appartenenza e non tocca l'identità della persona
      en: >-
        While the membership is live; deleted with the account (+ 14-day grace period, #13 E25).
        Leaving an account closes the membership and does not touch the person's identity

  - key: invitations.email
    entity: app.appgrove.core.platform.Invitation
    field: email
    location:
      it: Tabella `platform.invitations` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.invitations` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Persone invitate a entrare in un tenant (non ancora utenti)
      en: People invited to join a tenant (not yet users)
    data_category:
      it: Contatto (indirizzo email dell'invitato)
      en: Contact data (invitee email address)
    purpose:
      it: Recapito e gestione dell'invito (single-use, con scadenza; il token è salvato solo come hash)
      en: Delivery and management of the invitation (single-use, expiring; the token is stored hashed only)
    legal_basis:
      it: Misure precontrattuali / contratto (art. 6.1.b GDPR)
      en: Pre-contractual measures / contract (art. 6(1)(b) GDPR)
    retention:
      it: Fino a scadenza/accettazione dell'invito; soft-delete e purge secondo il ciclo piattaforma
      en: Until the invitation expires or is accepted; soft-delete and purge per the platform lifecycle
  - key: newsletter_subscribers.email
    entity: app.appgrove.core.newsletter.NewsletterSubscriber
    field: email
    location:
      it: Tabella `platform.newsletter_subscriber` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.newsletter_subscriber` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Iscritti alla newsletter (visitatori del sito e utenti registrati)
      en: Newsletter subscribers (site visitors and registered users)
    data_category:
      it: Contatto (indirizzo email dell'iscritto)
      en: Contact data (subscriber email address)
    purpose:
      it: >-
        Invio della newsletter (marketing diretto), con doppia conferma (double opt-in) e prova del
        consenso nel registro consensi (art. 7); Plausible resta analytics aggregato non identificativo
      en: >-
        Newsletter delivery (direct marketing), with double opt-in and proof of consent in the consent
        log (art. 7); Plausible remains aggregate, non-identifying analytics
    legal_basis:
      it: Consenso (art. 6.1.a GDPR) — separato e distinto dalle email transazionali (#13 F29)
      en: Consent (art. 6(1)(a) GDPR) — separate and distinct from transactional emails (#13 F29)
    retention:
      it: Finché iscritto + 24 mesi dopo la disiscrizione, poi eliminazione automatica (#13 E)
      en: While subscribed + 24 months after unsubscription, then automatic deletion (#13 E)

  - key: accounts.name
    entity: app.appgrove.core.platform.Account
    field: name
    location:
      it: Tabella `platform.accounts` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.accounts` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account (per i B2C individuali è tipicamente il nome della persona)
      en: Account holders (for individual B2C accounts it is typically the person's name)
    data_category:
      it: Identità/anagrafica account (classificazione prudente — può essere ragione sociale)
      en: Identity / account name (prudent classification — may be a company name)
    purpose:
      it: Identificazione dell'account/tenant nella piattaforma e nelle comunicazioni
      en: Identification of the account/tenant across the platform and communications
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: accounts.paddle_customer_id
    entity: app.appgrove.core.platform.Account
    field: paddleCustomerId
    location:
      it: Tabella `platform.accounts` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.accounts` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account con abbonamento
      en: Account holders with a subscription
    data_category:
      it: Identificativo online (customer id presso Paddle, pseudo-identificatore)
      en: Online identifier (customer id at Paddle, pseudo-identifier)
    purpose:
      it: "Riconciliazione abbonamenti/pagamenti con Paddle (Merchant of Record, titolare autonomo — #13 H)"
      en: "Subscription/payment reconciliation with Paddle (Merchant of Record, independent controller — #13 H)"
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: cognito.credentials
    location:
      it: User pool Amazon Cognito (eu-west-1); in locale solo provider dev (`services/auth`, fuori RoPA)
      en: Amazon Cognito user pool (eu-west-1); locally a dev-only provider (`services/auth`, out of RoPA scope)
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Credenziali di autenticazione (hash password) e segreti MFA/TOTP
      en: Authentication credentials (password hash) and MFA/TOTP secrets
    purpose:
      it: Autenticazione degli utenti e protezione dell'accesso (MFA)
      en: User authentication and access protection (MFA)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo; eliminazione con la cancellazione dell'utenza Cognito
      en: While the account is active; removed when the Cognito user is deleted

  - key: support_ticket.subject
    entity: app.appgrove.core.support.SupportTicket
    field: subject
    location:
      it: Tabella `platform.support_ticket` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.support_ticket` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Utenti che aprono richieste di supporto o di esercizio dei diritti
      en: Users opening support or data-rights requests
    data_category:
      it: >-
        Contenuto libero (oggetto della richiesta di supporto/privacy). Essendo scritto dall'utente
        può contenere, sulle istanze privacy, riferimenti a categorie particolari (art. 9): il testo
        non viene mai profilato, ma un riconoscitore deterministico di parole-spia contrassegna la
        richiesta per attenzione umana e ne alza la priorità (UC 0075). Il contrassegno è un
        booleano operativo: NON registra quale categoria sarebbe stata riconosciuta.
      en: >-
        Free-form content (subject of the support/privacy request). Being user-written it may
        contain, on data-rights requests, references to special categories (art. 9): the text is
        never profiled, but a deterministic keyword screening flags the request for human attention
        and raises its priority (UC 0075). The flag is an operational boolean: it does NOT record
        which category was recognised.
    purpose:
      it: "Gestione delle richieste di supporto e di esercizio dei diritti (ticketing in-house, #13 D21)"
      en: "Handling support and data-rights requests (in-house ticketing, #13 D21)"
    legal_basis:
      it: Contratto (art. 6.1.b GDPR); per i ticket privacy anche obbligo legale (art. 12 GDPR)
      en: Contract (art. 6(1)(b) GDPR); for privacy tickets also legal obligation (art. 12 GDPR)
    retention:
      it: "24 mesi dalla chiusura del ticket, poi eliminazione automatica (#13 E)"
      en: "24 months from ticket closure, then automatic deletion (#13 E)"

  - key: support_ticket_message.body
    entity: app.appgrove.core.support.SupportTicketMessage
    field: body
    location:
      it: Tabella `platform.support_ticket_message` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.support_ticket_message` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Utenti che scrivono nel thread di un ticket di supporto
      en: Users writing in a support-ticket thread
    data_category:
      it: >-
        Contenuto libero (testo dei messaggi della conversazione di supporto). Vale la stessa nota
        dell'oggetto: possibile presenza di categorie particolari (art. 9) nel testo scritto
        dall'utente, con contrassegno operativo per attenzione umana e nessuna categoria registrata
        (UC 0075). Il contenuto della conversazione non viaggia mai per email: le notifiche
        rimandano alla pagina.
      en: >-
        Free-form content (support-thread message text). Same note as the subject: user-written text
        may contain special categories (art. 9), with an operational flag for human attention and no
        category recorded (UC 0075). Thread content never travels by email: notifications link back
        to the page.
    purpose:
      it: "Gestione delle richieste di supporto e di esercizio dei diritti (ticketing in-house, #13 D21)"
      en: "Handling support and data-rights requests (in-house ticketing, #13 D21)"
    legal_basis:
      it: Contratto (art. 6.1.b GDPR); per i ticket privacy anche obbligo legale (art. 12 GDPR)
      en: Contract (art. 6(1)(b) GDPR); for privacy tickets also legal obligation (art. 12 GDPR)
    retention:
      it: "24 mesi dalla chiusura del ticket, poi eliminazione automatica (#13 E)"
      en: "24 months from ticket closure, then automatic deletion (#13 E)"

  - key: legal_acceptances.user_id
    entity: app.appgrove.core.legal.LegalAcceptance
    field: userId
    location:
      it: Tabella `platform.legal_acceptance` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.legal_acceptance` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Utenti registrati che accettano o prendono atto dei documenti legali
      en: Registered users accepting or acknowledging the legal documents
    data_category:
      it: Identificativo online (subject Cognito) collegato alla prova di accettazione
      en: Online identifier (Cognito subject) linked to the acceptance record
    purpose:
      it: "Prova dell'accettazione/presa d'atto dei documenti legali (rendicontazione, art. 5.2 GDPR; UC 0056)"
      en: "Proof of acceptance/acknowledgement of the legal documents (accountability, art. 5(2) GDPR; UC 0056)"
    legal_basis:
      it: Contratto (art. 6.1.b GDPR) e obbligo di rendicontazione (art. 5.2 GDPR)
      en: Contract (art. 6(1)(b) GDPR) and accountability obligation (art. 5(2) GDPR)
    retention:
      it: "Per la vita dell'account e il periodo di prescrizione applicabile (prova del consenso contrattuale, #13 E) — da confermare in revisione legale"
      en: "For the account lifetime and the applicable limitation period (proof of contractual consent, #13 E) — to be confirmed in legal review"

  - key: billing_transactions.paddle_transaction_id
    entity: app.appgrove.core.billing.BillingTransaction
    field: paddleTransactionId
    location:
      it: Tabella `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento (nei B2C individuali, persone fisiche)
      en: Account holders who made a payment (for individual B2C accounts, natural persons)
    data_category:
      it: Identificativo online (id della transazione presso Paddle, pseudo-identificatore)
      en: Online identifier (transaction id at Paddle, pseudo-identifier)
    purpose:
      it: >-
        Storico pagamenti e ricevute mostrato al titolare del conto nella pagina Billing (UC 0096) e
        riconciliazione con Paddle (Merchant of Record, titolare autonomo — #13 H)
      en: >-
        Payment history and receipts shown to the account holder on the Billing page (UC 0096) and
        reconciliation with Paddle (Merchant of Record, independent controller — #13 H)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: billing_transactions.amount
    entity: app.appgrove.core.billing.BillingTransaction
    field: amount
    location:
      it: Tabella `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento (nei B2C individuali, persone fisiche)
      en: Account holders who made a payment (for individual B2C accounts, natural persons)
    data_category:
      it: >-
        Dati di fatturazione (importo e valuta della transazione). NON sono dati di pagamento in senso
        stretto: nessun dato di carta o di conto transita o è conservato da appgrove (PCI in capo a Paddle)
      en: >-
        Billing data (transaction amount and currency). NOT payment instrument data: no card or bank
        details ever transit through or are stored by appgrove (PCI scope rests with Paddle)
    purpose:
      it: Mostrare al titolare del conto quanto e quando ha pagato (esecuzione del contratto, UC 0096)
      en: Showing the account holder what was paid and when (contract performance, UC 0096)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: billing_transactions.fee_amount
    entity: app.appgrove.core.billing.BillingTransaction
    field: feeAmount
    location:
      it: Tabella `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento (nei B2C individuali, persone fisiche)
      en: Account holders who made a payment (for individual B2C accounts, natural persons)
    data_category:
      it: >-
        Dati di fatturazione (commissione trattenuta da Paddle sulla transazione). Come l'importo, NON sono
        dati di pagamento in senso stretto: nessun dato di carta o di conto transita o è conservato da appgrove
      en: >-
        Billing data (fee withheld by Paddle on the transaction). Like the amount, NOT payment instrument
        data: no card or bank details ever transit through or are stored by appgrove
    purpose:
      it: >-
        Riconciliare il ricavo lordo con il denaro davvero accreditato sul conto (osservabilità economica
        della piattaforma, UC 0071). Non è mostrata al cliente: la vista è riservata all'amministratore
      en: >-
        Reconciling gross revenue with the money actually paid out (platform economic observability,
        UC 0071). Not shown to the customer: the view is restricted to the platform administrator
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: billing_transactions.net_amount
    entity: app.appgrove.core.billing.BillingTransaction
    field: netAmount
    location:
      it: Tabella `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento (nei B2C individuali, persone fisiche)
      en: Account holders who made a payment (for individual B2C accounts, natural persons)
    data_category:
      it: Dati di fatturazione (netto residuo della transazione dopo la commissione del fornitore)
      en: Billing data (net amount remaining after the provider fee)
    purpose:
      it: >-
        Riconciliare il ricavo lordo con il denaro davvero accreditato sul conto (osservabilità economica
        della piattaforma, UC 0071). Non è mostrato al cliente
      en: >-
        Reconciling gross revenue with the money actually paid out (platform economic observability,
        UC 0071). Not shown to the customer
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: billing_transactions.receipt_url
    entity: app.appgrove.core.billing.BillingTransaction
    field: receiptUrl
    location:
      it: Tabella `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1) — il documento è ospitato da Paddle
      en: Table `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1) — the document itself is hosted by Paddle
    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento
      en: Account holders who made a payment
    data_category:
      it: Collegamento a un documento di pagamento ospitato da Paddle (ricevuta intestata al cliente)
      en: Link to a payment document hosted by Paddle (receipt made out to the customer)
    purpose:
      it: Consentire al titolare del conto di aprire la ricevuta del proprio pagamento (UC 0096)
      en: Letting the account holder open the receipt for their own payment (UC 0096)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; il documento è conservato da Paddle (MoR)
      en: While the account is active + 14-day grace period; the document is retained by Paddle (MoR)

  - key: logs.structured
    location:
      it: CloudWatch Logs (eu-west-1/eu-central-1); audit su S3/Glacier (#08 I)
      en: CloudWatch Logs (eu-west-1/eu-central-1); audit trail on S3/Glacier (#08 I)
    data_subjects:
      it: Utenti della piattaforma
      en: Platform users
    data_category:
      it: Identificativi tecnici nei log strutturati (`tenant_id`, `app_id`, `user_id`, IP)
      en: Technical identifiers in structured logs (`tenant_id`, `app_id`, `user_id`, IP)
    purpose:
      it: "Sicurezza, stabilità e diagnostica (limitazione di finalità — niente profilazione, #13 B12)"
      en: "Security, stability and diagnostics (purpose limitation — no profiling, #13 B12)"
    legal_basis:
      it: Legittimo interesse (art. 6.1.f GDPR — sicurezza e continuità del servizio)
      en: Legitimate interest (art. 6(1)(f) GDPR — service security and continuity)
    retention:
      it: Log applicativi prod 30 giorni; audit/sicurezza 12 mesi su S3→Glacier (#08 I26)
      en: Prod application logs 30 days; audit/security 12 months on S3→Glacier (#08 I26)

  - key: logs.frontend_errors
    location:
      it: CloudWatch Logs (eu-west-1), log group dell'ingest errori (`/aws/lambda/appgrove-<env>-error-ingest`)
      en: CloudWatch Logs (eu-west-1), error-ingest log group (`/aws/lambda/appgrove-<env>-error-ingest`)
    data_subjects:
      it: Utenti delle SPA (anche non autenticati)
      en: SPA users (including unauthenticated)
    data_category:
      it: >-
        Eventi di SOLO errore JavaScript (#08 H23): messaggio/stack, rotta, versione build,
        identificativi opachi `user_id`/`tenant_id` se esiste una sessione. Niente IP, niente
        user agent, nessun tracking comportamentale.
      en: >-
        JavaScript ERROR-only events (#08 H23): message/stack, route, build version, opaque
        `user_id`/`tenant_id` when a session exists. No IP, no user agent, no behavioural tracking.
    purpose:
      it: "Diagnostica e stabilità del frontend (limitazione di finalità — solo errori, #13 B12)"
      en: "Frontend diagnostics and stability (purpose limitation — errors only, #13 B12)"
    legal_basis:
      it: Legittimo interesse (art. 6.1.f GDPR — qualità e continuità del servizio)
      en: Legitimate interest (art. 6(1)(f) GDPR — service quality and continuity)
    retention:
      it: Come i log applicativi (test 7 giorni, prod 30 giorni, #08 I26); nessun archivio lungo
      en: Same as application logs (test 7 days, prod 30 days, #08 I26); no long-term archive

sections:
  - key: recipients
    title:
      it: Destinatari e sub-responsabili
      en: Recipients and sub-processors
    body:
      it: >-
        Sub-responsabili: **AWS** (hosting, regioni UE — DPA con SCC + certificazione DPF) e
        **Plausible Analytics** (analytics senza cookie, hosting UE). **Paddle** (Merchant of Record)
        è **titolare autonomo** per i dati di pagamento, non sub-responsabile (#13 H45-47).
        Lista pubblica: `content/legal/subprocessors.<lang>.md` (UC 0002).
      en: >-
        Sub-processors: **AWS** (hosting, EU regions — DPA with SCCs + DPF certification) and
        **Plausible Analytics** (cookieless analytics, EU hosting). **Paddle** (Merchant of Record)
        is an **independent controller** for payment data, not a sub-processor (#13 H45-47).
        Public list: `content/legal/subprocessors.<lang>.md` (UC 0002).
  - key: transfers
    title:
      it: Trasferimenti extra-UE
      en: Non-EU transfers
    body:
      it: >-
        Dati a riposo solo in regioni UE (eu-west-1; monitoring eu-central-1) — #13 I51.
        AWS Inc. (USA, CLOUD Act): garanzie DPF + SCC nel DPA, più cifratura at-rest/in-transit (#13 I52).
      en: >-
        Data at rest only in EU regions (eu-west-1; monitoring in eu-central-1) — #13 I51.
        AWS Inc. (US, CLOUD Act): DPF + SCC safeguards in the DPA, plus at-rest/in-transit encryption (#13 I52).
  - key: security
    title:
      it: Misure di sicurezza
      en: Security measures
    body:
      it: >-
        Cifratura at-rest e in-transit; isolamento per-tenant row-level (`tenant_id` solo dal JWT
        verificato); least-privilege IAM; token di invito persistiti solo come hash; soft-delete con
        purge programmata (grace 14 giorni); logging strutturato e audit trail (#02/#05/#06/#08).
      en: >-
        At-rest and in-transit encryption; row-level per-tenant isolation (`tenant_id` only from the
        verified JWT); least-privilege IAM; invitation tokens stored hashed only; soft-delete with
        scheduled purge (14-day grace); structured logging and audit trail (#02/#05/#06/#08).
  - key: incident_response
    title:
      it: Risposta alle violazioni di dati (data breach)
      en: Personal data breach response
    body:
      it: >-
        Processo di Incident Response predisposto in anticipo (le 72 ore partono da quando si viene a
        conoscenza): runbook interno `docs/compliance/breach-runbook.md` (detect → assess → contain →
        notify → document) con albero delle soglie sul rischio per gli interessati e leva cifratura
        (art. 34.3); registro breach interno `docs/compliance/breach-register.md` che registra TUTTE le
        violazioni, anche non notificate (art. 33.5); notifiche per ruolo (titolare → Garante entro 72h
        art. 33 / interessati art. 34; responsabile → il tenant-titolare senza ritardo); canale di
        segnalazione responsabile `security@appgrove.app` + `security.txt` (#13 J56–J64).
      en: >-
        Incident Response process prepared in advance (the 72 hours run from awareness): internal runbook
        `docs/compliance/breach-runbook.md` (detect → assess → contain → notify → document) with a
        risk-to-data-subjects threshold tree and the encryption lever (art. 34(3)); internal breach
        register `docs/compliance/breach-register.md` recording ALL breaches, including non-notified ones
        (art. 33(5)); role-based notification (controller → Garante within 72h art. 33 / data subjects
        art. 34; processor → the tenant-controller without delay); responsible-disclosure channel
        `security@appgrove.app` + `security.txt` (#13 J56–J64).
