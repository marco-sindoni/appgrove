    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento (nei B2C individuali, persone fisiche)
      en: Account holders who made a payment (for individual B2C accounts, natural persons)
    data_category:
      it: Dati di fatturazione (netto residuo della transazione dopo la commissione del fornitore)
      en: Billing data (net amount remaining after the provider fee)
    purpose:
      it: >-
        Riconciliare il ricavo lordo con il denaro davvero accreditato sul conto (osservabilità economica
        della piattaforma, UC 0071). Non è mostrato al cliente
      en: >-
        Reconciling gross revenue with the money actually paid out (platform economic observability,
        UC 0071). Not shown to the customer
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: billing_transactions.receipt_url
    entity: app.appgrove.core.billing.BillingTransaction
    field: receiptUrl
    location:
      it: Tabella `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1) — il documento è ospitato da Paddle
      en: Table `platform.billing_transaction` (Aurora PostgreSQL, eu-west-1) — the document itself is hosted by Paddle
    data_subjects:
      it: Titolari dell'account che hanno effettuato un pagamento
      en: Account holders who made a payment
    data_category:
      it: Collegamento a un documento di pagamento ospitato da Paddle (ricevuta intestata al cliente)
      en: Link to a payment document hosted by Paddle (receipt made out to the customer)
    purpose:
