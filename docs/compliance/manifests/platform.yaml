# Manifesto dati — sezione PIATTAFORMA (UC 0030, #13 C14/C15/C18).
# Fonte unica: alimenta il RoPA interno (docs/compliance/ropa.<lang>.md, generato — NON editarlo a mano),
# lo snippet privacy pubblico (UC 0002) e l'export/erasure (UC 0032).
# Voci `entity`+`field` = entity-backed: il check JUnit (services/commons) le incrocia con @PersonalData.
# BOZZA SOTTO DISCLAIMER: validazione finale del legale (docs/_REVISIONE-LEGALE.md).

id: platform
name:
  it: Piattaforma appgrove (core)
  en: appgrove platform (core)
description:
  it: >-
    Trattamenti trasversali della piattaforma (account, identità delle persone, appartenenze,
    inviti, autenticazione, log). Dopo UC 0116 l'identità della persona è un dato di
    **piattaforma** (indirizzo, nome, lingua, identificativo di autenticazione) e l'appartenenza a
    un account è un dato **dell'account**: non cambia la finalità, cambia chi risponde per il dato.
    appgrove agisce come titolare per i consumatori B2C e come responsabile per i tenant B2B
    titolari (#13 C13). Paddle (Merchant of Record) è titolare autonomo per i dati di pagamento.
  en: >-
    Cross-cutting platform processing (accounts, person identities, memberships, invitations,
    authentication, logs). After UC 0116 the person's identity is **platform** data (email, name,
    language, authentication identifier) and account membership is **account** data: the purpose does
    not change, the party accountable for the data does.
    appgrove acts as controller towards B2C consumers and as processor for B2B tenant
    controllers (#13 C13). Paddle (Merchant of Record) is an independent controller for payment data.

entries:
  - key: identity.email
    entity: app.appgrove.core.platform.Identity
    field: email
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma (una identità, una o più appartenenze ad account)
      en: People registered on the platform (one identity, one or more account memberships)
    data_category:
      it: Contatto (indirizzo email)
      en: Contact data (email address)
    purpose:
      it: Erogazione e gestione dell'account (login, comunicazioni di servizio)
      en: Account provisioning and management (login, service communications)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Finché la persona ha almeno una appartenenza attiva + 14 giorni di grace dopo l'eliminazione
        dell'ultimo account (#13 E25); l'eliminazione di un account non cancella l'identità di chi
        appartiene anche ad altri account (UC 0116)
      en: >-
        While the person has at least one active membership + 14-day grace period after the last
        account is deleted (#13 E25); deleting one account does not erase the identity of someone who
        also belongs to other accounts (UC 0116)

  - key: identity.display_name
    entity: app.appgrove.core.platform.Identity
    field: displayName
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Identità (nome visualizzato)
      en: Identity (display name)
    purpose:
      it: Identificazione della persona nell'interfaccia e negli account a cui appartiene
      en: Identification of the person in the UI and across the accounts they belong to
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: identity.locale
    entity: app.appgrove.core.platform.Identity
    field: locale
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Preferenza dell'utente (lingua)
      en: User preference (language)
    purpose:
      it: >-
        Scelta della lingua (inglese/italiano) delle email transazionali di autenticazione
        (verifica indirizzo, reimpostazione password, invito) — UC 0018
      en: >-
        Language selection (English/Italian) for transactional authentication emails
        (address verification, password reset, invitation) — UC 0018
    legal_basis:
      it: Contratto (art. 6.1.b GDPR) — email transazionali, distinte dalla newsletter (consenso separato, #13 F29)
      en: Contract (art. 6(1)(b) GDPR) — transactional emails, distinct from the newsletter (separate consent, #13 F29)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: identity.cognito_sub
    entity: app.appgrove.core.platform.Identity
    field: cognitoSub
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Identificativo online (subject Cognito, pseudo-identificatore)
      en: Online identifier (Cognito subject, pseudo-identifier)
    purpose:
      it: Collegamento tra identità di autenticazione (Cognito) e profilo applicativo
      en: Link between the authentication identity (Cognito) and the application profile
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: identity.active_membership_id
    entity: app.appgrove.core.platform.Identity
    field: activeMembershipId
    location:
      it: Tabella `platform.identity` (Aurora PostgreSQL, eu-west-1) — dato di piattaforma, non dell'account
      en: Table `platform.identity` (Aurora PostgreSQL, eu-west-1) — platform data, not account data
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: >-
        Preferenza tecnica di sessione (riferimento all'appartenenza su cui la persona sta lavorando):
        non aggiunge alcun legame fra persona e azienda, che è già dichiarato sull'appartenenza
      en: >-
        Technical session preference (reference to the membership the person is working in): it adds no
        link between person and company, which is already declared on the membership
    purpose:
      it: >-
        Ricordare su quale account la persona stava lavorando, così che con più appartenenze la
        sessione sappia per conto di chi agisce (UC 0117). Il valore è un suggerimento: l'appartenenza
        viene riverificata a ogni creazione di token
      en: >-
        Remembering which account the person was working in, so that with several memberships the
        session knows on whose behalf it acts (UC 0117). The value is a hint: the membership is
        re-verified on every token creation
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché la persona ha almeno una appartenenza attiva (+ 14 giorni di grace, #13 E25)
      en: While the person has at least one active membership (+ 14-day grace period, #13 E25)

  - key: membership.identity_id
    entity: app.appgrove.core.platform.Membership
    field: identityId
    location:
      it: Tabella `platform.membership` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.membership` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persone che appartengono a un account (membri, amministratori, titolari dell'account)
      en: People belonging to an account (members, administrators, account owners)
    data_category:
      it: >-
        Identificativo online (riferimento all'identità della persona): il legame fra una persona e
        un'azienda è a sua volta un dato personale, anche se non contiene nome né indirizzo
      en: >-
        Online identifier (reference to the person's identity): the link between a person and a
        company is itself personal data, even though it contains neither name nor email
    purpose:
      it: >-
        Stabilire chi può presentarsi come persona di quell'account e con quale ruolo (UC 0116);
        l'account resta il confine dei dati. Da UC 0103 il NUMERO delle appartenenze vive, sommato agli
        inviti in attesa, determina anche l'importo dovuto dall'account per i posti: è una precisazione
        di finalità dentro il trattamento di fatturazione già dichiarato — nessuna categoria nuova,
        nessuna base giuridica nuova, nessun destinatario nuovo (al fornitore di pagamento vanno
        l'importo e l'identificativo dell'account, mai l'elenco delle persone)
      en: >-
        Establishing who may act as a person of that account and in which role (UC 0116); the account
        remains the data boundary. From UC 0103 the NUMBER of live memberships, plus pending invitations,
        also determines the amount the account owes for its seats: this is a clarification of purpose
        within the already declared billing processing — no new category, no new legal basis, no new
        recipient (the payment provider receives the amount and the account identifier, never the list
        of people)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Finché l'appartenenza è viva; eliminata con l'account (+ 14 giorni di grace, #13 E25).
        L'uscita da un account chiude l'appartenenza e non tocca l'identità della persona
      en: >-
        While the membership is live; deleted with the account (+ 14-day grace period, #13 E25).
        Leaving an account closes the membership and does not touch the person's identity

  - key: app_access.identity_id
    entity: app.appgrove.core.platform.AppAccess
    field: identityId
    location:
      it: Tabella `platform.app_access` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.app_access` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persone dell'account abilitate a usare una applicazione
      en: People of the account enabled to use an application
    data_category:
      it: >-
        Dato di autorizzazione: identificativo online (riferimento all'identità della persona)
        associato al ruolo su una singola applicazione. Non contiene né nome né indirizzo, ma dice
        quale applicazione quella persona usa e con quale potere
      en: >-
        Authorisation data: online identifier (reference to the person's identity) paired with the
        role on a single application. It contains neither name nor email, but it states which
        application that person uses and with which power
    purpose:
      it: >-
        Consentire alle persone dell'account di usare le applicazioni acquistate, con il ruolo
        assegnato dall'owner o dall'amministratore di quella applicazione (UC 0098)
      en: >-
        Allowing the people of the account to use the purchased applications with the role assigned
        by the owner or by that application's administrator (UC 0098)
    legal_basis:
      it: Contratto con l'account titolare (art. 6.1.b GDPR)
      en: Contract with the controlling account (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Legata alla vita dell'appartenenza: l'accesso si cancella con la persona che esce dall'account
        e con l'account stesso (+ 14 giorni di grace, #13 E25). La revoca è una cancellazione logica,
        così che riconcedere l'accesso non richieda di ricostruirne la storia
      en: >-
        Tied to the life of the membership: access is deleted when the person leaves the account and
        with the account itself (+ 14-day grace period, #13 E25). Revocation is a logical deletion, so
        that re-granting access does not require rebuilding its history

  - key: seat_reduction_people.identity_id
    entity: app.appgrove.core.billing.seats.SeatDowngradeItem
    field: identityId
    location:
      it: Tabella `platform.seat_downgrade_item` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.seat_downgrade_item` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persone dell'account indicate per la cessazione alla fine del periodo pagato
      en: People of the account marked for termination at the end of the paid period
    data_category:
      it: >-
        Identificativo online (riferimento all'identità della persona indicata). Non contiene né nome
        né indirizzo, ma dice una cosa delicata: che il rapporto fra quella persona e quell'account è
        stato messo in scadenza. Nessuna categoria particolare (art. 9): è un dato di gestione del
        rapporto, non un giudizio sulla persona
      en: >-
        Online identifier (reference to the identity of the person marked). It contains neither name
        nor email, but it states something sensitive: that the relationship between that person and
        that account has been put on notice. No special category (art. 9): it is relationship
        management data, not a judgement on the person
    purpose:
      it: >-
        Eseguire la riduzione dei posti alla fine del periodo già pagato: sapere quali persone
        usciranno dall'account e quanti posti a pagamento resteranno (UC 0104). È una precisazione
        dentro la finalità già dichiarata per l'appartenenza — gestione del rapporto e determinazione
        dell'importo dovuto per i posti — non una finalità nuova
      en: >-
        Executing the seat reduction at the end of the already-paid period: knowing which people will
        leave the account and how many paid seats will remain (UC 0104). It is a clarification within
        the purpose already declared for the membership — relationship management and determination of
        the amount due for seats — not a new purpose
    legal_basis:
      it: Contratto con l'account titolare (art. 6.1.b GDPR)
      en: Contract with the controlling account (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Finché la riduzione è conservata (in attesa, eseguita o annullata); eliminata con l'account
        (+ 14 giorni di grace, #13 E25). L'annullamento e la rimozione della persona dall'elenco sono
        cancellazioni logiche, così che la storia di che cosa era stato deciso resti leggibile a chi
        governa l'account. Nessun avviso automatico viene inviato alla persona indicata: la
        comunicazione spetta al datore di lavoro, non alla piattaforma
      en: >-
        While the reduction is retained (pending, executed or cancelled); deleted with the account
        (+ 14-day grace period, #13 E25). Cancelling the reduction and removing a person from the list
        are logical deletions, so that the history of what had been decided stays readable to whoever
        runs the account. No automatic notice is sent to the person marked: that communication is the
        employer's, not the platform's

  - key: seat_reductions.requested_by
    entity: app.appgrove.core.billing.seats.SeatDowngrade
    field: requestedBy
    location:
      it: Tabella `platform.seat_downgrade` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.seat_downgrade` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persona dell'account (owner) che ha chiesto la riduzione dei posti
      en: Person of the account (owner) who requested the seat reduction
    data_category:
      it: >-
        Identificativo online (riferimento all'identità di chi ha chiesto la riduzione): traccia di
        controllo di chi, dentro l'account, ha deciso la cessazione di una o più persone
      en: >-
        Online identifier (reference to the identity of whoever requested the reduction): audit trail
        of who, inside the account, decided the termination of one or more people
    purpose:
      it: >-
        Rendere ricostruibile chi ha deciso una cessazione, come per ogni altro atto privilegiato
        dell'account (UC 0104, UC 0006). Non serve all'autorizzazione: quella è nell'annotazione
        dell'operazione di rete
      en: >-
        Making it reconstructable who decided a termination, as for any other privileged act of the
        account (UC 0104, UC 0006). It is not used for authorisation: that lives in the annotation of
        the network operation
    legal_basis:
      it: Contratto con l'account titolare (art. 6.1.b GDPR)
      en: Contract with the controlling account (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Finché la riduzione è conservata; eliminata con l'account (+ 14 giorni di grace, #13 E25)
      en: >-
        While the reduction is retained; deleted with the account (+ 14-day grace period, #13 E25)

  - key: invitations.email
    entity: app.appgrove.core.platform.Invitation
    field: email
    location:
      it: Tabella `platform.invitations` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.invitations` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Persone invitate a entrare in un tenant (non ancora utenti)
      en: People invited to join a tenant (not yet users)
    data_category:
      it: Contatto (indirizzo email dell'invitato)
      en: Contact data (invitee email address)
    purpose:
      it: Recapito e gestione dell'invito (single-use, con scadenza; il token è salvato solo come hash)
      en: Delivery and management of the invitation (single-use, expiring; the token is stored hashed only)
    legal_basis:
      it: Misure precontrattuali / contratto (art. 6.1.b GDPR)
      en: Pre-contractual measures / contract (art. 6(1)(b) GDPR)
    retention:
      it: Fino a scadenza/accettazione dell'invito; soft-delete e purge secondo il ciclo piattaforma
      en: Until the invitation expires or is accepted; soft-delete and purge per the platform lifecycle
  - key: invitations.identity_id
    entity: app.appgrove.core.platform.Invitation
    field: identityId
    location:
      it: Tabella `platform.invitations` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.invitations` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persone invitate a entrare in un account che hanno già un'identità appgrove
      en: People invited to join an account who already have an appgrove identity
    data_category:
      it: >-
        Identificativo online (riferimento all'identità della persona invitata), valorizzato solo
        quando quell'indirizzo ha già un'identità sulla piattaforma
      en: >-
        Online identifier (reference to the invited person's identity), set only when that address
        already has an identity on the platform
    purpose:
      it: >-
        Collegare l'invito a una persona che esiste già, per farla entrare con una appartenenza in più
        e non con una seconda identità (UC 0118)
      en: >-
        Linking the invitation to a person who already exists, so they join with one more membership
        instead of a second identity (UC 0118)
    legal_basis:
      it: Misure precontrattuali / contratto (art. 6.1.b GDPR)
      en: Pre-contractual measures / contract (art. 6(1)(b) GDPR)
    retention:
      it: >-
        Fino a scadenza o chiusura dell'invito; eliminato con l'account (+ 14 giorni di grace,
        #13 E25). NON viene mai restituito a chi ha invitato, ed è esportato solo per gli inviti
        ACCETTATI — su un invito in attesa rivelerebbe l'esistenza di un rapporto fra quella persona
        e la piattaforma, che non è informazione dell'account che invita (UC 0118 §5)
      en: >-
        Until the invitation expires or is closed; deleted with the account (+ 14-day grace period,
        #13 E25). It is NEVER returned to the inviter, and is exported only for ACCEPTED invitations —
        on a pending invitation it would reveal that the person already has a relationship with the
        platform, which is not the inviting account's information (UC 0118 §5)
  - key: invitations.seat_charge_ref
    entity: app.appgrove.core.platform.Invitation
    field: seatChargeRef
    location:
      it: Tabella `platform.invitations` (Aurora PostgreSQL, eu-west-1) — dato dell'account
      en: Table `platform.invitations` (Aurora PostgreSQL, eu-west-1) — account data
    data_subjects:
      it: Persone invitate a entrare in un account il cui posto è stato pagato
      en: People invited to join an account whose seat was paid for
    data_category:
      it: >-
        Dato di fatturazione: riferimento opaco alla transazione presso il fornitore di pagamento che ha
        autorizzato il posto di quella persona. Non contiene né importi né estremi di pagamento, ed è
        dichiarato per prudenza: sta su una riga il cui soggetto è una persona, e collega quella persona
        a un pagamento
      en: >-
        Billing data: opaque reference to the payment-provider transaction that authorised that person's
        seat. It contains neither amounts nor payment details, and is declared out of caution: it sits on
        a row whose subject is a person, and links that person to a payment
    purpose:
      it: >-
        Poter dimostrare che il posto di quella persona era pagato prima che l'invito partisse (UC 0103),
        e poter annullare l'addebito se l'invito non nasce
      en: >-
        Being able to show that the person's seat was paid before the invitation went out (UC 0103), and
        to reverse the charge if the invitation is not created
    legal_basis:
      it: Contratto (art. 6.1.b GDPR) — esecuzione del contratto con l'account titolare
      en: Contract (art. 6(1)(b) GDPR) — performance of the contract with the account holder
    retention:
      it: >-
        Come l'invito che lo porta: fino a scadenza o chiusura dell'invito; eliminato con l'account
        (+ 14 giorni di grace, #13 E25). Nullo quando il posto non è costato nulla (franchigia, o posto
        già pagato nel periodo in corso)
      en: >-
        Same as the invitation carrying it: until the invitation expires or is closed; deleted with the
        account (+ 14-day grace period, #13 E25). Null when the seat cost nothing (free allowance, or a
        seat already paid for in the current period)
  - key: newsletter_subscribers.email
    entity: app.appgrove.core.newsletter.NewsletterSubscriber
    field: email
    location:
      it: Tabella `platform.newsletter_subscriber` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.newsletter_subscriber` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Iscritti alla newsletter (visitatori del sito e utenti registrati)
      en: Newsletter subscribers (site visitors and registered users)
    data_category:
      it: Contatto (indirizzo email dell'iscritto)
      en: Contact data (subscriber email address)
    purpose:
      it: >-
        Invio della newsletter (marketing diretto), con doppia conferma (double opt-in) e prova del
        consenso nel registro consensi (art. 7); Plausible resta analytics aggregato non identificativo
      en: >-
        Newsletter delivery (direct marketing), with double opt-in and proof of consent in the consent
        log (art. 7); Plausible remains aggregate, non-identifying analytics
    legal_basis:
      it: Consenso (art. 6.1.a GDPR) — separato e distinto dalle email transazionali (#13 F29)
      en: Consent (art. 6(1)(a) GDPR) — separate and distinct from transactional emails (#13 F29)
    retention:
      it: Finché iscritto + 24 mesi dopo la disiscrizione, poi eliminazione automatica (#13 E)
      en: While subscribed + 24 months after unsubscription, then automatic deletion (#13 E)

  - key: accounts.name
    entity: app.appgrove.core.platform.Account
    field: name
    location:
      it: Tabella `platform.accounts` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.accounts` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account (per i B2C individuali è tipicamente il nome della persona)
      en: Account holders (for individual B2C accounts it is typically the person's name)
    data_category:
      it: Identità/anagrafica account (classificazione prudente — può essere ragione sociale)
      en: Identity / account name (prudent classification — may be a company name)
    purpose:
      it: Identificazione dell'account/tenant nella piattaforma e nelle comunicazioni
      en: Identification of the account/tenant across the platform and communications
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace dopo l'eliminazione (#13 E25)
      en: While the account is active + 14-day grace period after deletion (#13 E25)

  - key: accounts.paddle_customer_id
    entity: app.appgrove.core.platform.Account
    field: paddleCustomerId
    location:
      it: Tabella `platform.accounts` (Aurora PostgreSQL, eu-west-1)
      en: Table `platform.accounts` (Aurora PostgreSQL, eu-west-1)
    data_subjects:
      it: Titolari dell'account con abbonamento
      en: Account holders with a subscription
    data_category:
      it: Identificativo online (customer id presso Paddle, pseudo-identificatore)
      en: Online identifier (customer id at Paddle, pseudo-identifier)
    purpose:
      it: "Riconciliazione abbonamenti/pagamenti con Paddle (Merchant of Record, titolare autonomo — #13 H)"
      en: "Subscription/payment reconciliation with Paddle (Merchant of Record, independent controller — #13 H)"
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
    retention:
      it: Finché l'account è attivo + 14 giorni di grace; gli obblighi fiscali sui pagamenti restano in capo a Paddle
      en: While the account is active + 14-day grace period; fiscal retention on payments rests with Paddle

  - key: cognito.credentials
    location:
      it: User pool Amazon Cognito (eu-west-1); in locale solo provider dev (`services/auth`, fuori RoPA)
      en: Amazon Cognito user pool (eu-west-1); locally a dev-only provider (`services/auth`, out of RoPA scope)
    data_subjects:
      it: Persone registrate sulla piattaforma
      en: People registered on the platform
    data_category:
      it: Credenziali di autenticazione (hash password) e segreti MFA/TOTP
      en: Authentication credentials (password hash) and MFA/TOTP secrets
    purpose:
      it: Autenticazione degli utenti e protezione dell'accesso (MFA)
      en: User authentication and access protection (MFA)
    legal_basis:
      it: Contratto (art. 6.1.b GDPR)
      en: Contract (art. 6(1)(b) GDPR)
