  # ---- Buchi dichiarati -----------------------------------------------------
  - id: J-QUOTA-UPGRADE
    titolo: Quota a consumo — il passaggio di fascia sblocca di nuovo la creazione (su fatture)
    usecases: ["0027", "0052"]
    stato: da-coprire
    motivo: >-
      Il catalogo di `fatture` ha oggi la sola fascia gratuita, e i percorsi collaudano l'esistente senza
      estendere il prodotto. Il ciclo completo tetto → rifiuto → passaggio di fascia → sblocco è coperto
      sulla metrica a giacenza (posti) del mini-CRM dentro J-MEMBERS. Da estendere quando `fatture` avrà
      una fascia a pagamento (decisione di listino, skill `pricing-change`).
    possiede: "0091"

  - id: J-APP-ROLE-REFUSALS
    titolo: Autorizzazione per applicazione — i due rifiuti si distinguono a parole sullo schermo
    usecases: ["0099", "0101"]
    stato: coperto
    test:
      - livello: l2
        file: frontend/apps/backoffice/e2e/roles.spec.ts

  - id: J-ROLES
    titolo: La stessa applicazione vista dai quattro ruoli — comandi disabilitati con spiegazione, sezioni in sola lettura, ambiti assenti
    usecases: ["0101"]
    stato: da-coprire
    motivo: >-
      Il percorso pretende che una persona apra la STESSA applicazione con quattro ruoli diversi e veda
      quattro schermate coerenti: il comando dispositivo presente-ma-disabilitato con la spiegazione del
      ruolo mancante, la sezione di governo visibile in sola lettura, gli ambiti che non competono al ruolo
      assenti dalla navigazione. Di questo, la change 0095 (UC 0101) consegna il CONTRATTO e l'involucro
      condiviso (`DisabledForRole` del design system, coperto al livello di componente), ma nessuna
      schermata lo monta ancora: perché lo monti, il browser deve conoscere il ruolo della persona
      sull'applicazione — la lettura `GET /api/platform/v1/me/app-access` portata nella shell, che è la
      fondazione di UC 0107, e la schermata di governo, che è UC 0111. Un percorso che non può cliccare
      niente non è un percorso: si scrive quando quelle due storie esistono. Ciò che è visibile OGGI —
      i due rifiuti letti a parole — è coperto da J-APP-ROLE-REFUSALS.
    possiede: "0113"

  - id: J-PWD-REVOKE
    titolo: Reimpostazione password — le sessioni aperte in precedenza smettono di valere
    usecases: ["0017", "0058"]
    stato: da-coprire
    motivo: >-
      Il provider di autenticazione locale non revoca i gettoni di rinnovo (token senza stato, nessuna lista
      di revoca): l'asserzione «il vecchio rinnovo non vale più» oggi fallirebbe sul comportamento reale.
      Divario di prodotto, non di collaudo.
    possiede: "0058"

  - id: J-PRIVACY-WITHDRAW-MSG
    titolo: Recesso per-app — conferma esplicita all'utente dopo la cancellazione dei dati dell'app
    usecases: ["0033"]
    stato: da-coprire
    motivo: >-
      Il messaggio «recesso completato» è reso dentro la riga dell'applicazione, che viene smontata appena
      l'elenco si rinfresca: la conferma può non essere mai visibile. J-PRIVACY accetta perciò come esito
      valido sia il messaggio sia la sparizione dell'app. Il percorso diventa collaudabile quando la conferma
      sarà spostata fuori dall'elenco (avviso di pagina o notifica persistente).
    possiede: "0033"

  - id: A-GDPR-RESTRICT-ACCOUNT
    titolo: Limitazione del trattamento applicata al conto (non al singolo utente) con effetto osservabile
    usecases: ["0034"]
    stato: da-coprire
    motivo: >-
      Limitare un conto sospende la riga del conto, ma la validità di una sessione dipende solo dallo stato
      della riga utente: la misura viene registrata e non produce alcun effetto. A-GDPR applica quindi la
      limitazione all'utente, che funziona. Va prima deciso se la limitazione sul conto debba propagarsi ai
      suoi utenti o se il bersaglio "conto" vada rimosso perché fuorviante: è direzione di prodotto.
    possiede: "0034"

  - id: A-GDPR-RESTRICT-MSG
    titolo: L'utente sotto limitazione legge un messaggio dedicato, non "credenziali non valide"
    usecases: ["0017", "0034"]
    stato: da-coprire
    motivo: >-
      Il servizio di autenticazione risponde con un errore generico per ogni utenza non attiva, quindi chi è
      sotto limitazione legge «credenziali non valide» invece del testo dedicato che pure esiste nel catalogo
      dei messaggi. Può essere una scelta deliberata di riservatezza: da valutare insieme ai flussi di
      autenticazione prima di collaudarla.
    possiede: "0034"

  - id: J-I18N
    titolo: Localizzazione end-to-end — interfaccia ed email nella stessa lingua, per tutte e cinque le lingue
    usecases: ["0060"]
    stato: da-coprire
    motivo: >-
      La parità dei cataloghi di traduzione è già coperta dai test unitari e di livello 2; un percorso per
      lingua quintuplicherebbe il tempo della suite di piattaforma senza aggiungere rischio coperto. Si
      riapre quando la localizzazione dell'interfaccia delle app sarà esercitata da utenti reali.
    possiede: "0060"

  - id: J-SUPPORT-TICKETING
    titolo: >-
      Assistenza con il sistema di richieste nativo — apertura ed email di conferma, coda della piattaforma,
      risposta, replica del cliente, chiusura, con escalation delle categorie particolari
    usecases: ["0034", "0075"]
    stato: coperto
    test:
      - livello: platform
        file: tools/platform-e2e/journeys/J-SUPPORT-TICKETING.spec.ts

  # ---- Esclusioni motivate --------------------------------------------------
  - id: F-DEGRADE-TELEMETRY
    titolo: Guasto di un servizio — allarmi e telemetria emessi correttamente
    usecases: ["0006", "0007"]
    stato: escluso
    motivo: >-
      F-DEGRADE osserva l'esperienza dell'utente durante un guasto vero. Le asserzioni su allarmi, metriche e
      segnalazione degli errori appartengono all'area di osservabilità e ai suoi test dedicati: verificarle
      con un browser costerebbe molto e coprirebbe poco.

# ── Use case senza superficie applicativa da collaudare a browser ─────────────
# Ogni use case del catalogo che NON compare in `usecases_con_superficie` DEVE comparire qui,
# con una categoria e un motivo. Categorie ammesse:
#   • senza-superficie  — nessuna superficie applicativa propria (servizi, infrastruttura, strumenti,
#                         adempimenti di business, librerie di stile). Esenzione permanente.
#   • vetrina-statica   — superficie del sito vetrina (pagine statiche Astro), coperta dai controlli
#                         post-build dell'area `site` e non da percorsi a browser. Esenzione permanente.
#   • non-implementato  — la superficie NON esiste ancora in main. Esenzione TEMPORANEA: il controllo la
#                         rifiuta appena compare una cartella changes/*-use-case-NNNN-*.
esenzioni:
  - usecase: "0001"
    categoria: senza-superficie
    motivo: Adempimenti di business e fiscali fuori dal prodotto (commercialista, partita IVA, conto Paddle).
  - usecase: "0002"
    categoria: vetrina-statica
    motivo: I documenti legali sono resi dalla vetrina; l'accettazione dentro il prodotto è UC 0056, coperta da J-LEGAL.
  - usecase: "0003"
    categoria: senza-superficie
    motivo: Fondamenta Terraform — infrastruttura, nessuna interfaccia.
  - usecase: "0004"
    categoria: senza-superficie
    motivo: Modulo Terraform `microsaas_app` e script di supporto — infrastruttura.
  - usecase: "0005"
    categoria: senza-superficie
    motivo: Pipeline di integrazione e rilascio continui — nessuna interfaccia.
  - usecase: "0006"
    categoria: senza-superficie
    motivo: Osservabilità di base (log, metriche, allarmi) — nessuna interfaccia del prodotto.
