  # ── Epica 22 — rifacimento del modello di appartenenza (analisi: change 0087) ──
  # Sedici storie appena scritte (docs/usecases/22-refactor-membership-model/story/): NESSUNA è ancora
  # implementata, quindi tutte esenti come `non-implementato`. Il controllo rifiuterà l'esenzione appena
  # compare la cartella changes/*-use-case-NNNN-*: allora la storia va riclassificata — fra le superfici
  # con il suo percorso, oppure come `senza-superficie` se non ne ha (quelle di modello, autorizzazione,
  # listino e strumenti). L'indicazione di quale sarà la classificazione giusta è già scritta qui accanto,
  # per non doverla ricostruire fra sei mesi.
  - usecase: "0098"
    categoria: senza-superficie
    motivo: >-
      Modello dati dell'accesso per applicazione e ruolo di piattaforma a due valori — storia di modello
      dati (change 0091): nessuna superficie propria. La tabella e le sue regole sono provate dai collaudi
      di integrazione e dalla prova di separazione fra account; le superfici che la consumano arrivano con
      0100 (elenco unico), 0107 (menu per ruolo) e 0111 (gestione utenti dentro l'applicazione). L'unico
      effetto visibile qui è una SPARIZIONE — il selettore del ruolo nella schermata dei membri — e J-MEMBERS
      ne pretende l'assenza invece di esercitarlo.
  - usecase: "0102"
    categoria: senza-superficie
    motivo: >-
      Listino dei posti a scaglioni progressivi: modello versionato e calcolo (change 0097). Storia di
      modello e calcolo, senza superficie propria — lo dichiara il suo §6 («Nessuna schermata»). Il calcolo è
      provato dal collaudo tabellare di unità sui casi della storia §4 (confini compresi, monotonia del
      dovuto e discesa del costo del posto successivo), la conservazione versionata e la selezione per data
      dai collaudi di integrazione, il conteggio dei posti dalla prova stato per stato con separazione fra
      account. Le superfici che consumeranno questo listino arrivano con 0103 (riquadro dei posti), 0105
      (governo delle tariffe in console) e 0106 (i posti nella sezione «Billing»).
  - usecase: "0103"
