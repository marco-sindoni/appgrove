# ─────────────────────────────────────────────────────────────────────────────
# Registro di copertura end-to-end (UC 0093)
#
# Mappa: use case con superficie applicativa → percorso (journey) richiesto → test che lo copre.
# È LEGGIBILE DA UN PROGRAMMA: il controllo `tools/e2e-coverage` lo confronta con la realtà del
# repository a ogni esecuzione di `./run-tests.sh tooling` e diventa rosso quando divergono.
#
# Formato, regole di manutenzione e come leggere un rosso: docs/testing/README.md
# NON si modifica a mano senza rileggere quel documento.
# ─────────────────────────────────────────────────────────────────────────────

versione: 1
aggiornato: 2026-08-02

# ── Use case la cui superficie applicativa interattiva ESISTE OGGI in main ────
# Elenco autorevole (non desunto dalla prosa dei drill-down: il controllo dev'essere deterministico).
# Ognuno di questi DEVE essere referenziato da almeno un percorso qui sotto, in qualunque stato.
usecases_con_superficie:
  - "0017" # Flussi auth UI (signup/login/reset/invito/2FA/onboarding)
  - "0020" # Backoffice SPA shell
  - "0021" # Console admin SPA
  - "0024" # Checkout (overlay + attesa attivazione)
  - "0028" # Portale cliente / gestione abbonamento self-service
  - "0033" # Self-service GDPR ("I miei dati")
  - "0034" # Console "Diritti GDPR" (admin)
  - "0052" # Modulo frontend app #1 (fatture)
  - "0054" # App #2 (mini-CRM) via new-application
  - "0056" # Ri-accettazione ToU/PP a runtime (schermata bloccante)
  - "0059" # Gestione membri & inviti (UI backoffice)
  - "0060" # Localizzazione UI delle app alle 5 lingue
  - "0067" # Gestione abbonamento self-service (sezione "Abbonamenti" completa)
  - "0071" # Riconciliazione netto/revenue (vista admin lordo → commissioni → netto → accredito)
  - "0075" # Ticketing nativo in-house (pagina Supporto del cliente + sezione Ticket della console)
  - "0076" # Disabilita applicazione (leva admin, effetti sul cliente)
  - "0077" # Provider entitlement reale (menu laterale e matrice)
  - "0095" # Pagina "App catalog" del backoffice (vetrina, stati, ricerca, paginazione)
  - "0096" # Billing solo-fatturazione (abbonamenti + storico pagamenti/ricevute)
  - "0097" # Dashboard operativa del workspace (+ Workspace ID in Account)
  - "0099" # Rifiuti dell'autorizzazione per applicazione, letti a schermo nel Mini-CRM
  - "0100" # Sezione «Members» come elenco unico di persone, senza ruolo (applicazioni per persona)
  - "0101" # Semantica dei tre ruoli: i due rifiuti letti a schermo nell'app #1, che il ruolo ora governa
  - "0117" # Account attivo nella sessione e selettore (barra laterale, cambio con ricarica)
  - "0118" # Inviti e registrazione con identità esistente (sezione inviti nel cruscotto, scelta account all'accesso)

